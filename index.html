<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Garantir Acesso</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #09090b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Fix para o preenchimento automático não estragar o fundo */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #18181b inset !important;
            -webkit-text-fill-color: white !important;
            border-radius: 0.75rem;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <div id="app-container" class="w-full max-w-md mx-auto relative flex flex-col min-h-screen justify-center">
        
        <div id="form-screen" class="relative z-10 flex-1 flex flex-col transition-opacity duration-300">
            <div class="flex-1 flex flex-col p-5">
                
                <div class="flex justify-center mb-6">
                    <div class="inline-flex items-center gap-2 px-4 py-2 bg-blue-500/10 border border-blue-500/20 rounded-full">
                        <div class="w-2 h-2 bg-blue-400 rounded-full animate-pulse"></div>
                        <span class="text-blue-400 text-sm font-medium">Último passo</span>
                    </div>
                </div>
                
                <div class="text-center mb-6">
                    <div class="w-16 h-16 mx-auto mb-4 bg-gradient-to-br from-blue-500/20 to-blue-600/20 rounded-2xl flex items-center justify-center border border-white/5">
                        <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                    </div>
                    <h1 class="text-xl font-bold text-white mb-2">Garanta seu Acesso</h1>
                    <p class="text-gray-400 text-sm leading-relaxed max-w-xs mx-auto">Informe seus dados para liberar o conteúdo e receber atualizações exclusivas</p>
                </div>
                
                <form id="access-form" class="flex-1 flex flex-col">
                    
                    <div class="mb-4">
                        <label class="flex items-center gap-2 text-sm font-medium text-gray-300 mb-2">
                            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                            Seu melhor email<span class="text-red-400">*</span>
                        </label>
                        <div class="relative rounded-xl transition-all duration-200">
                            <input id="email" required placeholder="seu@email.com" class="w-full px-4 py-4 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:bg-white/[0.07] focus:border-blue-500/50 transition-all" autocomplete="email" type="email">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="flex items-center gap-2 text-sm font-medium text-gray-300 mb-2">
                            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                            Telefone<span class="text-red-400">*</span>
                        </label>
                        <div class="relative rounded-xl transition-all duration-200">
                            <input id="phone" required placeholder="(11) 99999-9999" class="w-full px-4 py-4 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:bg-white/[0.07] focus:border-blue-500/50 transition-all" autocomplete="tel" type="tel">
                        </div>
                    </div>
                    
                    <div class="mb-5">
                        <label class="flex items-center gap-2 text-sm font-medium text-gray-300 mb-2">
                            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            Data de nascimento<span class="text-red-400">*</span>
                        </label>
                        <div class="relative rounded-xl transition-all duration-200">
                            <input id="dob" required inputmode="numeric" placeholder="DD/MM/AAAA" maxlength="10" class="w-full px-4 py-4 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:bg-white/[0.07] focus:border-blue-500/50 transition-all" autocomplete="bday" type="text">
                        </div>
                    </div>
                    
                    <div class="mt-auto pt-4 pb-6">
                        <button id="submit-btn" type="button" disabled class="w-full py-4 bg-gradient-to-r from-blue-500 to-blue-600 text-white font-semibold rounded-xl hover:from-blue-600 hover:to-blue-700 transition-all duration-200 shadow-lg shadow-blue-500/20 active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100 flex items-center justify-center gap-2">
                            <span>Liberar Acesso</span>
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                        </button>
                        
                        <div class="flex items-center justify-center gap-1.5 mt-4 text-gray-500 text-xs">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            <span>Seus dados estão seguros</span>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div id="success-screen" class="hidden flex-col items-center justify-center w-full min-h-[60vh] transition-opacity duration-300 px-5 absolute inset-0 z-50">
            
            <div class="w-20 h-20 bg-blue-500 rounded-full flex items-center justify-center mb-6 shadow-[0_0_40px_rgba(59,130,246,0.3)]">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>
            
            <h1 class="text-2xl font-bold mb-3 text-center text-white">Acesso Liberado!</h1>
            <p class="text-gray-400 text-sm text-center mb-10">
                Seu conteúdo está sendo enviado...
            </p>

            <button id="close-btn" class="flex items-center justify-center gap-2 bg-white/5 border border-white/10 hover:bg-white/10 text-white px-6 py-3 rounded-xl text-sm font-medium transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                Fechar ( <span id="timer">5</span> )
            </button>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#09090b');
        tg.setBackgroundColor('#09090b');

        const formScreen = document.getElementById('form-screen');
        const successScreen = document.getElementById('success-screen');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');
        const dobInput = document.getElementById('dob');
        const submitBtn = document.getElementById('submit-btn');
        const closeBtn = document.getElementById('close-btn');
        const timerDisplay = document.getElementById('timer');

        // Máscara Telefone
        phoneInput.addEventListener('input', function (e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,5})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
            checkFormValidity();
        });

        // Máscara Data
        dobInput.addEventListener('input', function (e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,2})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : x[1] + '/' + x[2] + (x[3] ? '/' + x[3] : '');
            checkFormValidity();
        });

        emailInput.addEventListener('input', checkFormValidity);

        function checkFormValidity() {
            const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value);
            const phoneValid = phoneInput.value.replace(/\D/g, '').length === 11;
            const dobDigits = dobInput.value.replace(/\D/g, '');
            const dobValid = dobDigits.length === 8;

            if (emailValid && phoneValid && dobValid) {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        }

        // Animação para a tela de Sucesso
        submitBtn.addEventListener('click', function() {
            formScreen.classList.add('opacity-0');
            
            setTimeout(() => {
                formScreen.classList.add('hidden');
                successScreen.classList.remove('hidden');
                successScreen.classList.add('flex');
                
                setTimeout(() => {
                    successScreen.classList.add('opacity-100');
                    iniciarContagem();
                }, 50);
            }, 300);
        });

        // Contagem e Fechamento
        let countdown = 5;
        function iniciarContagem() {
            const interval = setInterval(() => {
                countdown--;
                timerDisplay.innerText = countdown;
                
                if (countdown <= 0) {
                    clearInterval(interval);
                    fecharMiniApp();
                }
            }, 1000);

            closeBtn.addEventListener('click', () => {
                clearInterval(interval);
                fecharMiniApp();
            });
        }

        function fecharMiniApp() {
            document.body.style.opacity = '0'; 
            setTimeout(() => {
                if (tg && tg.initDataUnsafe && Object.keys(tg.initDataUnsafe).length > 0) {
                    tg.close();
                } else {
                    window.close();
                }
            }, 300); 
        }
    </script>
</body>
</html>
