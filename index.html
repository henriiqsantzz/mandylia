<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Garantir Acesso</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* Fundo e tipografia exatos do design premium */
        body {
            background-color: #0e141a; 
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            transition: opacity 0.3s ease;
        }
        
        /* Cores dos inputs */
        .input-bg { background-color: #1a222c; }
        .input-border { border: 1px solid #273340; }
        .input-border:focus-within { border-color: #00c070; }
        
        /* Botão principal */
        .btn-green { background-color: #00c070; }
        .btn-green:hover { background-color: #00a862; }
        
        /* O estado disabled exatamente como na sua imagem (cinza escuro) */
        .btn-green:disabled { 
            background-color: #2b3644; 
            color: #6c7e93;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Input autofill fix para navegadores webkit */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #1a222c inset !important;
            -webkit-text-fill-color: white !important;
        }
        
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div id="app-container" class="w-full max-w-sm relative overflow-hidden mt-8">
        
        <div id="form-screen" class="flex flex-col items-center w-full transition-opacity duration-300">
            
            <div class="flex items-center gap-2 bg-[#121c22] border border-[#1a2d2d] rounded-full px-4 py-1.5 mb-6 text-sm font-medium text-[#00c070]">
                <div class="w-1.5 h-1.5 rounded-full bg-[#00c070]"></div>
                Último passo
            </div>

            <div class="bg-[#17212b] w-16 h-16 rounded-2xl mb-6 flex items-center justify-center shadow-lg border border-[#212f3c]">
                <i class="ph ph-shield-check text-3xl text-[#00c070]"></i>
            </div>

            <h1 class="text-[22px] font-bold mb-2 text-center text-white">Garanta seu Acesso</h1>
            <p class="text-[#8090a2] text-center text-[13px] leading-relaxed mb-8 px-2">
                Informe seus dados para liberar o conteúdo e receber atualizações exclusivas
            </p>

            <form id="access-form" class="w-full flex flex-col gap-4">
                
                <div class="flex flex-col gap-1.5">
                    <label class="text-[13px] font-semibold flex items-center gap-2 text-white">
                        <i class="ph ph-envelope-simple text-[#8090a2] text-base"></i> Seu melhor email <span class="text-red-500">*</span>
                    </label>
                    <input type="email" id="email" placeholder="seu@email.com" class="w-full input-bg input-border rounded-xl px-4 py-3.5 text-sm text-white placeholder-[#4e5d6d] outline-none transition-colors" required>
                </div>

                <div class="flex flex-col gap-1.5">
                    <label class="text-[13px] font-semibold flex items-center gap-2 text-white">
                        <i class="ph ph-phone text-[#8090a2] text-base"></i> Telefone <span class="text-red-500">*</span>
                    </label>
                    <input type="tel" id="phone" placeholder="(11) 99999-9999" class="w-full input-bg input-border rounded-xl px-4 py-3.5 text-sm text-white placeholder-[#4e5d6d] outline-none transition-colors" required>
                </div>

                <div class="flex flex-col gap-1.5 mb-2">
                    <label class="text-[13px] font-semibold flex items-center gap-2 text-white">
                        <i class="ph ph-calendar-blank text-[#8090a2] text-base"></i> Data de nascimento <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="dob" placeholder="DD/MM/AAAA" class="w-full input-bg input-border rounded-xl px-4 py-3.5 text-sm text-white placeholder-[#4e5d6d] outline-none transition-colors" required>
                </div>

                <button type="button" id="submit-btn" disabled class="w-full btn-green font-semibold rounded-xl py-3.5 flex items-center justify-center gap-2 transition-all active:scale-[0.98]">
                    Liberar Acesso <i class="ph ph-arrow-right text-lg"></i>
                </button>
            </form>
        </div>

        <div id="success-screen" class="hidden flex-col items-center w-full min-h-[50vh] transition-opacity duration-300 pt-10">
            
            <div class="w-full bg-[#00c070] h-20 rounded-[28px] mb-8 flex items-center justify-start px-8 shadow-[0_4px_25px_rgba(0,192,112,0.15)] relative overflow-hidden">
                <i class="ph-bold ph-check text-3xl text-white"></i>
            </div>
            
            <h1 class="text-[22px] font-bold mb-2 text-center text-white">Acesso Liberado!</h1>
            <p class="text-[#8090a2] text-sm text-center mb-10">Seu conteúdo está sendo enviado...</p>

            <button id="close-btn" class="flex items-center gap-2 bg-[#1a222c] border border-[#273340] hover:bg-[#273340] transition-colors text-white px-5 py-2.5 rounded-lg text-sm font-semibold self-start">
                <i class="ph ph-x"></i> Fechar ( <span id="timer">5</span> )
            </button>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const formScreen = document.getElementById('form-screen');
        const successScreen = document.getElementById('success-screen');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');
        const dobInput = document.getElementById('dob');
        const submitBtn = document.getElementById('submit-btn');
        const closeBtn = document.getElementById('close-btn');
        const timerDisplay = document.getElementById('timer');

        // Máscaras e Validações
        phoneInput.addEventListener('input', function (e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,5})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
            checkFormValidity();
        });

        dobInput.addEventListener('input', function (e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,2})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : x[1] + '/' + x[2] + (x[3] ? '/' + x[3] : '');
            checkFormValidity();
        });

        emailInput.addEventListener('input', checkFormValidity);

        function checkFormValidity() {
            const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value);
            const phoneValid = phoneInput.value.replace(/\D/g, '').length === 11;
            const dobDigits = dobInput.value.replace(/\D/g, '');
            const dobValid = dobDigits.length === 8;

            if (emailValid && phoneValid && dobValid) {
                submitBtn.disabled = false;
                submitBtn.classList.remove('text-[#6c7e93]');
                submitBtn.classList.add('text-white');
            } else {
                submitBtn.disabled = true;
                submitBtn.classList.add('text-[#6c7e93]');
                submitBtn.classList.remove('text-white');
            }
        }

        // Troca de Telas
        submitBtn.addEventListener('click', function() {
            formScreen.classList.add('opacity-0');
            
            setTimeout(() => {
                formScreen.classList.add('hidden');
                successScreen.classList.remove('hidden');
                
                setTimeout(() => {
                    successScreen.classList.add('opacity-100');
                    iniciarContagem();
                }, 50);
            }, 300);
        });

        // Fechamento
        let countdown = 5;
        function iniciarContagem() {
            const interval = setInterval(() => {
                countdown--;
                timerDisplay.innerText = countdown;
                
                if (countdown <= 0) {
                    clearInterval(interval);
                    fecharMiniApp();
                }
            }, 1000);

            closeBtn.addEventListener('click', () => {
                clearInterval(interval);
                fecharMiniApp();
            });
        }

        function fecharMiniApp() {
            document.body.style.opacity = '0'; 
            setTimeout(() => {
                if (tg && tg.initDataUnsafe && Object.keys(tg.initDataUnsafe).length > 0) {
                    tg.close();
                } else {
                    console.log("Fechando app...");
                    window.close();
                }
            }, 300); 
        }
    </script>
</body>
</html>
