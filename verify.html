<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de Segurança</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --tg-blue: #24A1DE;
            --tg-bg: #f4f4f5;
            --tg-text: #222222;
            --tg-gray: #8E8E93;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: var(--tg-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Container Principal */
        .verification-card {
            background: #ffffff;
            width: 90%;
            max-width: 380px;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo-main {
            width: 80px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 10px;
            color: var(--tg-text);
        }

        p {
            font-size: 14px;
            color: var(--tg-gray);
            line-height: 1.4;
            margin-bottom: 30px;
        }

        /* Estilo do Slider */
        .slider-container {
            position: relative;
            width: 100%;
            height: 60px;
            background: #F1F1F3;
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 5px;
            user-select: none;
            overflow: hidden;
        }

        .slider-text {
            position: absolute;
            width: 100%;
            text-align: center;
            left: 0;
            font-size: 14px;
            color: var(--tg-gray);
            pointer-events: none;
            z-index: 1;
        }

        .slider-handle {
            position: relative;
            z-index: 2;
            width: 50px;
            height: 50px;
            background: var(--tg-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(36, 161, 222, 0.3);
            transition: transform 0.1s ease;
        }

        .slider-handle img {
            width: 24px;
            height: 24px;
            filter: brightness(0) invert(1);
        }

        /* Tela de Sucesso (Oculta Inicialmente) */
        .success-content {
            display: none;
        }

        .gift-icon {
            font-size: 50px;
            margin-bottom: 15px;
            display: block;
        }

        .loading-dots:after {
            content: ' .';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {
            0%, 20% { color: rgba(0,0,0,0); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
            40% { color: var(--tg-blue); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
            60% { text-shadow: .25em 0 0 var(--tg-blue), .5em 0 0 rgba(0,0,0,0); }
            80%, 100% { text-shadow: .25em 0 0 var(--tg-blue), .5em 0 0 var(--tg-blue); }
        }
    </style>
</head>
<body>

    <div class="verification-card" id="card">
        <div id="step-verify">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram" class="logo-main">
            <h2>Verificação de Segurança</h2>
            <p>Para continuar e acessar o conteúdo, por favor confirme que você é um humano.</p>
            
            <div class="slider-container" id="sliderContainer">
                <div class="slider-text">Arraste para verificar</div>
                <div class="slider-handle" id="sliderHandle">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="TG">
                </div>
            </div>
        </div>

        <div id="step-gift" class="success-content">
            <span class="gift-icon">🎁</span>
            <h2>Você recebeu um presente!</h2>
            <p>Sua conta foi verificada com sucesso. Estamos preparando sua recompensa exclusiva...</p>
            <p style="color: var(--tg-blue); font-weight: 500;" class="loading-dots">Redirecionando para o Bot</p>
        </div>
    </div>

    <script>
        const handle = document.getElementById('sliderHandle');
        const container = document.getElementById('sliderContainer');
        const card = document.getElementById('card');
        const stepVerify = document.getElementById('step-verify');
        const stepGift = document.getElementById('step-gift');

        let isDragging = false;
        let startX = 0;
        let maxDrag = container.offsetWidth - handle.offsetWidth - 10;

        // Configurações do seu Bot
        const SEU_BOT_LINK = "https://t.me/SEU_BOT_AQUI"; 

        function startDrag(e) {
            isDragging = true;
            startX = (e.type === 'mousedown') ? e.pageX : e.touches[0].pageX;
        }

        function onDrag(e) {
            if (!isDragging) return;
            
            let currentX = (e.type === 'mousemove') ? e.pageX : e.touches[0].pageX;
            let moveX = currentX - startX;

            if (moveX < 0) moveX = 0;
            if (moveX > maxDrag) moveX = maxDrag;

            handle.style.transform = `translateX(${moveX}px)`;

            // Se chegar no fim
            if (moveX >= maxDrag) {
                isDragging = false;
                completeVerification();
            }
        }

        function stopDrag() {
            if (!isDragging) return;
            isDragging = false;
            handle.style.transition = 'transform 0.3s ease';
            handle.style.transform = 'translateX(0px)';
            setTimeout(() => { handle.style.transition = ''; }, 300);
        }

        function completeVerification() {
            // Transição suave entre as telas
            stepVerify.style.display = 'none';
            stepGift.style.display = 'block';
            card.style.borderColor = '#24A1DE';
            
            // Redirecionamento após 5 segundos
            setTimeout(() => {
                window.location.href = SEU_BOT_LINK;
            }, 5000);
        }

        // Eventos Mouse
        handle.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('mouseup', stopDrag);

        // Eventos Touch (Mobile)
        handle.addEventListener('touchstart', startDrag);
        window.addEventListener('touchmove', onDrag);
        window.addEventListener('touchend', stopDrag);
    </script>
</body>
</html>
